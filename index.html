<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMC Depo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Depo Takip">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c0d;
    --panel:#161617;
    --panel-2:#1c1c1e;
    --panel-3:#242426;
    --border:#2c2c2e;
    --border-2:#3d3d40;
    --text:#f1efec;
    --text-muted:#a6a3a0;
    --text-dim:#726f6d;
    --accent:#c02f2a;
    --accent-dim:#7a1e1b;
    --accent-text:#ffd9d6;
    --amber:#e2a13d;
    --amber-text:#3d2a0c;
    --rust:#e2554a;
    --rust-text:#3a1710;
    --green:#5fae6a;
    --green-text:#12250f;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:1100px;margin:0 auto;padding:0 0 60px;}

  /* ---- header ---- */
  header.topbar{
    background:linear-gradient(180deg,#161516,#0e0d0e);
    border-bottom:3px solid var(--accent);
    padding:16px 20px 14px;
    position:relative;
  }
  header.topbar::before{
    content:'';
    position:absolute; top:8px; left:8px; width:6px; height:6px; border-radius:50%;
    background:var(--border-2); box-shadow: calc(100% + 4px) 0 0 var(--border-2);
  }
  .brand{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .brand img.logo{ height:48px; width:auto; display:block; }
  .brand .brand-text{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .brand h1{
    font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:0.06em;
    font-size:22px; text-transform:uppercase; margin:0; color:var(--text);
  }
  .brand span.sub{font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text);}

  nav.tabs{display:flex; gap:4px; margin-top:14px;}
  nav.tabs button{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
    font-size:12.5px; padding:9px 16px; background:transparent; border:1px solid var(--border);
    border-bottom:none; color:var(--text-muted); cursor:pointer; border-radius:6px 6px 0 0;
  }
  nav.tabs button.active{ background:var(--panel); color:var(--text); border-color:var(--border-2); }
  nav.tabs button:hover:not(.active){ color:var(--text); }

  /* ---- toolbar ---- */
  .toolbar{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .toolbar input[type=text], .toolbar select{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:9px 12px; border-radius:6px; font-size:13.5px; font-family:inherit;
  }
  .toolbar input[type=text]{flex:1; min-width:160px;}
  .toolbar select{min-width:140px;}
  .spacer{flex:1;}
  button.btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:9px 14px; border-radius:6px; cursor:pointer; border:1px solid var(--border-2);
    background:var(--panel-2); color:var(--text); white-space:nowrap;
  }
  button.btn:hover{ background:var(--panel-3); }
  button.btn.primary{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent-text); }
  button.btn.primary:hover{ background:var(--accent); }
  button.btn.ghost{ background:transparent; border-color:var(--border); color:var(--text-muted); }
  button.btn.small{ padding:6px 10px; font-size:12px; }
  button.btn.danger-ghost{ background:transparent; border-color:var(--border); color:var(--rust); }
  button.btn.danger-ghost:hover{ background:rgba(193,88,74,0.12); }

  main{padding:18px 20px;}

  /* ---- machine plate badge ---- */
  .plate{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    font-size:11.5px; color:var(--text-muted);
    background:var(--panel-2); border:1px solid var(--border-2); border-radius:4px;
    padding:4px 9px 4px 16px; position:relative;
  }
  .plate::before, .plate::after{
    content:''; position:absolute; top:50%; width:3px; height:3px; border-radius:50%;
    background:var(--border-2); transform:translateY(-50%);
  }
  .plate::before{ left:5px; }
  .plate::after{ display:none; }

  /* ---- status dot ---- */
  .status{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;}
  .status .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .status.ok{ color:var(--green); }
  .status.ok .dot{ background:var(--green); }
  .status.low{ color:var(--amber); }
  .status.low .dot{ background:var(--amber); }
  .status.out{ color:var(--rust); }
  .status.out .dot{ background:var(--rust); }

  /* ---- table (part rows) ---- */
  .table-wrap{ border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .t-head, .t-row{
    display:grid;
    grid-template-columns: 5px 1.6fr 1.1fr 0.7fr 0.9fr 0.9fr 0.9fr 128px;
    align-items:center;
  }
  .t-head{
    background:var(--panel-2); border-bottom:1px solid var(--border);
    font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--text-dim); font-weight:600;
  }
  .t-head > div{ padding:10px 12px; }
  .t-row{ background:var(--panel); border-bottom:1px solid var(--border); }
  .t-row:last-child{ border-bottom:none; }
  .t-row:hover{ background:var(--panel-2); }
  .t-row > div{ padding:11px 12px; overflow:hidden; text-overflow:ellipsis; }
  .t-row .bar{ align-self:stretch; padding:0; }
  .row-name{ font-weight:600; }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .cell-num{ font-family:'JetBrains Mono',monospace; }

  @media (max-width: 760px){
    .t-head{ display:none; }
    .table-wrap{ border:none; }
    .t-row{
      display:block; position:relative; background:var(--panel);
      border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px;
      padding:12px 14px 12px 18px;
    }
    .t-row .bar{ position:absolute; left:0; top:0; bottom:0; width:5px; border-radius:var(--radius) 0 0 var(--radius); }
    .t-row > div{ padding:3px 0; }
    .t-row [data-label]::before{
      content: attr(data-label); display:block; font-size:10.5px; text-transform:uppercase;
      letter-spacing:0.04em; color:var(--text-dim); font-family:'Oswald',sans-serif; margin-bottom:1px;
    }
    .row-actions{ justify-content:flex-start; margin-top:8px; }
  }

  .empty{
    text-align:center; padding:60px 20px; color:var(--text-muted);
    border:1px dashed var(--border-2); border-radius:var(--radius);
  }
  .empty h3{ font-family:'Oswald',sans-serif; color:var(--text); margin:0 0 6px; font-size:16px; text-transform:uppercase; letter-spacing:0.03em;}
  .empty p{ margin:0 0 16px; font-size:13.5px; }
  .empty .empty-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* ---- metric cards (özet) ---- */
  .metrics{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:22px; }
  .metric{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
  .metric .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); font-family:'Oswald',sans-serif; font-weight:600; }
  .metric .value{ font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; margin-top:6px; color:var(--text); }
  .metric.warn .value{ color:var(--amber); }
  .metric.bad .value{ color:var(--rust); }
  .metric.good .value{ color:var(--green); }

  h2.section-title{
    font-family:'Oswald',sans-serif; font-size:14px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--text-muted); margin:0 0 12px; font-weight:600;
  }

  /* ---- modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,12,13,0.62); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:16px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border-2); border-radius:10px;
    width:100%; max-width:440px; max-height:88vh; overflow-y:auto; padding:20px;
  }
  .modal h3{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:15px;
    margin:0 0 16px; color:var(--text);
  }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px; font-weight:600; }
  .field input, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:9px 11px; border-radius:6px; font-size:13.5px; font-family:inherit;
  }
  .field textarea{ font-family:'JetBrains Mono',monospace; font-size:12.5px; min-height:140px; resize:vertical; }
  .field .hint{ font-size:11.5px; color:var(--text-dim); margin-top:4px; }
  .field .err{ font-size:12px; color:var(--rust); margin-top:4px; display:none; }
  .field.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field.two > div{ min-width:0; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

  /* ---- toast ---- */
  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--panel-3); border:1px solid var(--border-2); color:var(--text);
    padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity 0.2s, transform 0.2s; z-index:80;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading{ text-align:center; padding:60px 0; color:var(--text-muted); font-size:13.5px; }

  /* ---- print / PDF ---- */
  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ position:absolute; top:0; left:0; width:100%; padding:24px; display:block !important; }
  }
  #printArea{ font-family:'Inter',system-ui,sans-serif; color:#111; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #printArea .p-headline{ display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2.5px solid #111; padding-bottom:10px; margin-bottom:10px; }
  #printArea .p-brand{ display:flex; align-items:center; gap:10px; }
  #printArea .p-brand img{ height:34px; width:auto; }
  #printArea .p-brand-text{ font-family:'Oswald',sans-serif; font-weight:700; font-size:17px; letter-spacing:0.04em; text-transform:uppercase; }
  #printArea .p-doctype{ font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-top:2px; }
  #printArea .p-meta{ font-size:11px; color:#555; text-align:right; }
  #printArea table{ width:100%; border-collapse:collapse; margin-bottom:16px; font-size:11.5px; }
  #printArea thead th{ background:#111; color:#fff; font-weight:600; padding:7px 8px; text-align:left; }
  #printArea td{ border-bottom:1px solid #E2E2E2; padding:6px 8px; }
  #printArea tbody tr:nth-child(even){ background:#F5F5F3; }
  #printArea td.r, #printArea th.r{ text-align:right; }
  #printArea .p-summary{ margin-top:6px; border:1.5px solid #111; border-radius:6px; padding:12px 16px; max-width:340px; margin-left:auto; }
  #printArea .p-summary div{ display:flex; justify-content:space-between; padding:3px 0; font-size:12.5px; }
  #printArea .p-summary .final{ border-top:1px solid #111; margin-top:4px; padding-top:6px; font-weight:700; font-size:14px; color:var(--accent); }
  #printArea .p-footer{ margin-top:26px; font-size:9.5px; color:#999; text-align:center; border-top:1px solid #E2E2E2; padding-top:8px; }
</style>
</head>

<script>
(function(){

  var state = {
    parts: [],
    sales: [],
    machines: [],
    services: [],
    priceList: [],
    activeTab: 'stok',
    search: '',
    machineFilter: '',
    selectedMachineId: null,
    loaded: false
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function fmtDate(s){
    if(!s) return '-';
    var p = s.split('-');
    if(p.length !== 3) return s;
    return p[2] + '.' + p[1] + '.' + p[0];
  }

  function fmtMoney(n){
    n = Number(n) || 0;
    return n.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ₺';
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var STORAGE_KEY = 'dmc-depo-inventory-store';

  async function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var val = JSON.parse(raw);
        state.parts = val.parts || [];
        state.sales = val.sales || [];
        state.machines = val.machines || [];
        state.services = val.services || [];
        state.priceList = val.priceList || [];
      }
    }catch(e){
      state.parts = [];
      state.sales = [];
      state.machines = [];
      state.services = [];
      state.priceList = [];
    }
    state.loaded = true;
  }

  async function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({parts: state.parts, sales: state.sales, machines: state.machines, services: state.services, priceList: state.priceList}));
      return true;
    }catch(e){
      showToast('Kaydedilemedi. Tarayıcı depolama alanı dolu olabilir.');
      return false;
    }
  }

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function getMachines(){
    var set = {};
    state.parts.forEach(function(p){ if(p.machine) set[p.machine] = true; });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b,'tr'); });
  }

  function getCustomers(){
    var set = {};
    state.sales.forEach(function(s){ if(s.customer) set[s.customer] = true; });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b,'tr'); });
  }

  function stockStatus(qty){
    qty = Number(qty);
    if(qty <= 0) return {cls:'out', label:'Tükendi', color:'var(--rust)'};
    if(qty <= 3) return {cls:'low', label:'Az', color:'var(--amber)'};
    return {cls:'ok', label:'Yeterli', color:'var(--green)'};
  }

  function filteredParts(){
    var q = state.search.trim().toLocaleLowerCase('tr');
    return state.parts.filter(function(p){
      if(state.machineFilter && p.machine !== state.machineFilter) return false;
      if(!q) return true;
      return (p.name || '').toLocaleLowerCase('tr').indexOf(q) !== -1 ||
             (p.machine || '').toLocaleLowerCase('tr').indexOf(q) !== -1;
    }).sort(function(a,b){ return (a.name||'').localeCompare(b.name||'', 'tr'); });
  }

  function filteredSales(){
    var q = state.search.trim().toLocaleLowerCase('tr');
    var list = state.sales.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
    if(state.activeTab !== 'satislar') return list;
    if(!q) return list;
    return list.filter(function(s){
      return (s.partName||'').toLocaleLowerCase('tr').indexOf(q) !== -1 ||
             (s.customer||'').toLocaleLowerCase('tr').indexOf(q) !== -1 ||
             (s.machine||'').toLocaleLowerCase('tr').indexOf(q) !== -1;
    });
  }

  /* ---------------- TOOLBAR ---------------- */

  function renderToolbar(){
    var tb = document.getElementById('toolbar');
    if(state.activeTab === 'makina' && state.selectedMachineId){
      tb.innerHTML = '<div class="spacer"></div>';
      return;
    }
    if(state.activeTab === 'fiyat'){
      tb.innerHTML = '<input type="text" id="search-input" placeholder="Makina adı veya model ara…" value="'+escapeHtml(state.search)+'">' +
        '<div class="spacer"></div>' +
        '<button class="btn ghost" id="btn-print-fiyat">🖨 PDF İndir</button>' +
        '<button class="btn primary" id="btn-add-fiyat">+ Makina Ekle</button>';
      document.getElementById('search-input').oninput = function(e){ state.search = e.target.value; renderContent(); };
      document.getElementById('btn-print-fiyat').onclick = function(){ printPriceList(); };
      document.getElementById('btn-add-fiyat').onclick = function(){ openPriceModal(); };
      return;
    }

    var machines = getMachines();
    var machineOptions = '<option value="">Tüm makineler</option>' + machines.map(function(m){
      return '<option value="'+escapeHtml(m)+'"' + (state.machineFilter===m?' selected':'') + '>'+escapeHtml(m)+'</option>';
    }).join('');

    var placeholder = state.activeTab === 'stok' ? 'Parça veya makine ara…' :
      (state.activeTab === 'makina' ? 'Firma veya makina ara…' : 'Parça, makine veya müşteri ara…');

    var html = '<input type="text" id="search-input" placeholder="'+placeholder+'" value="'+escapeHtml(state.search)+'">';
    if(state.activeTab === 'stok'){
      html += '<select id="machine-filter">'+machineOptions+'</select>';
    }
    html += '<div class="spacer"></div>';
    html += '<button class="btn ghost" id="btn-print-stock">🖨 PDF İndir</button>';
    if(state.activeTab === 'stok'){
      html += '<button class="btn ghost" id="btn-bulk">Toplu Ekle</button>';
      html += '<button class="btn primary" id="btn-add">+ Parça Ekle</button>';
    }
    if(state.activeTab === 'satislar'){
      html += '<button class="btn primary" id="btn-add-sale">+ Satış Ekle</button>';
    }
    if(state.activeTab === 'makina' && !state.selectedMachineId){
      html += '<button class="btn primary" id="btn-add-machine">+ Makina Satışı Ekle</button>';
    }
    tb.innerHTML = html;
    document.getElementById('btn-print-stock').onclick = function(){ printStockList(); };

    var si = document.getElementById('search-input');
    si.oninput = function(){ state.search = si.value; renderContent(); };
    if(state.activeTab === 'stok'){
      document.getElementById('machine-filter').onchange = function(e){
        state.machineFilter = e.target.value; renderContent();
      };
      document.getElementById('btn-add').onclick = function(){ openPartModal(null); };
      document.getElementById('btn-bulk').onclick = function(){ openBulkModal(); };
    }
    if(state.activeTab === 'satislar'){
      document.getElementById('btn-add-sale').onclick = function(){ openAddSaleModal(); };
    }
    if(state.activeTab === 'makina' && !state.selectedMachineId){
      document.getElementById('btn-add-machine').onclick = function(){ openMachineModal(); };
    }
  }

  /* ---------------- STOK TAB ---------------- */

  function renderStok(){
    var list = filteredParts();
    if(state.parts.length === 0){
      return '<div class="empty">' +
        '<h3>Henüz parça yok</h3>' +
        '<p>Listenizi hızlıca aktarmak için toplu ekleme kullanın ya da tek tek parça girin.</p>' +
        '<div class="empty-actions">' +
          '<button class="btn ghost" id="empty-bulk">Toplu Ekle</button>' +
          '<button class="btn primary" id="empty-add">+ Parça Ekle</button>' +
        '</div></div>';
    }
    if(list.length === 0){
      return '<div class="empty"><h3>Sonuç yok</h3><p>Arama veya filtre kriterlerine uyan parça bulunamadı.</p></div>';
    }

    var rows = list.map(function(p){
      var st = stockStatus(p.qty);
      return '<div class="t-row" data-id="'+p.id+'">' +
        '<div class="bar" style="background:'+st.color+'"></div>' +
        '<div class="row-name" data-label="Malzeme Adı">'+escapeHtml(p.name)+'</div>' +
        '<div data-label="Makine"><span class="plate">'+escapeHtml(p.machine||'-')+'</span></div>' +

  /* ---------------- SATISLAR TAB ---------------- */

  function renderSatislar(){

      var lineTotal = (Number(s.salePrice)||0) * (Number(s.qty)||0);

  /* ---------------- MAIN RENDER ---------------- */

  function renderContent(){
    var content = document.getElementById('content');
    if(!state.loaded){
      content.innerHTML = '<div class="loading">Yükleniyor…</div>';
      return;
    }
    if(state.activeTab === 'stok') content.innerHTML = renderStok();
    else if(state.activeTab === 'satislar') content.innerHTML = renderSatislar();
    else if(state.activeTab === 'makina') content.innerHTML = renderMakina();
    else content.innerHTML = renderFiyatListesi();

    bindContentEvents();
    bindMakinaEvents();
    bindFiyatEvents();
  }

  function bindContentEvents(){
    document.querySelectorAll('[data-action="sell"]').forEach(function(btn){
      btn.onclick = function(){ openSellModal(btn.getAttribute('data-id')); };
    });
    document.querySelectorAll('[data-action="edit"]').forEach(function(btn){
      btn.onclick = function(){ openPartModal(btn.getAttribute('data-id')); };
    });
    document.querySelectorAll('[data-action="delete"]').forEach(function(btn){
      btn.onclick = function(){ deletePart(btn.getAttribute('data-id')); };
    });
    document.querySelectorAll('[data-action="delete-sale"]').forEach(function(btn){
      btn.onclick = function(){ deleteSale(btn.getAttribute('data-id')); };
    });
    var eb = document.getElementById('empty-bulk');
    if(eb) eb.onclick = function(){ openBulkModal(); };
    var ea = document.getElementById('empty-add');
    if(ea) ea.onclick = function(){ openPartModal(null); };
  }

    state.activeTab = tab;

    document.querySelectorAll('nav.tabs button').forEach(function(b){

      if(lines.length === 0){ errEl.textContent = 'Eklenecek satır bulunamadı.'; errEl.style.display='block'; return; }

        var sale = parseFloat((parts[4]||'0').replace(',','.')); if(isNaN(sale)) sale = 0;
        state.parts.push({ id: uid(), name: name, machine: machine, qty: qty, costPrice: cost, salePrice: sale });

      if(added === 0){
        errEl.textContent = 'Hiçbir satır eklenemedi. Ad ve makine alanlarını kontrol edin.';
        errEl.style.display = 'block';
        return;
      }
      var ok = await saveData();
      closeModal();
      renderToolbar();
      renderContent();
      if(ok) showToast(added + ' parça eklendi' + (skipped ? ', ' + skipped + ' satır atlandı.' : '.'));
    };

  /* ---------------- CSV EXPORT ---------------- */

  function downloadCsv(filename, rows){
    var csv = rows.map(function(r){
      return r.map(function(cell){
        var s = String(cell == null ? '' : cell);
        if(s.indexOf(';') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1){
          s = '"' + s.replace(/"/g,'""') + '"';
        }
        return s;
      }).join(';');
    }).join('\n');
    var blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportPartsCsv(){
    var rows = [['Malzeme Adı','Makine','Stok','Alış Fiyatı','Satış Fiyatı']];
    state.parts.forEach(function(p){ rows.push([p.name, p.machine, p.qty, p.costPrice, p.salePrice]); });
    downloadCsv('stok-listesi.csv', rows);
    showToast('Stok listesi indirildi.');
  }

  function exportSalesCsv(){
    var rows = [['Tarih','Malzeme Adı','Makine','Müşteri','Adet','Satış Fiyatı','Toplam']];
    state.sales.forEach(function(s){
      rows.push([s.date, s.partName, s.machine, s.customer, s.qty, s.salePrice, (Number(s.salePrice)||0)*(Number(s.qty)||0)]);
    });
    downloadCsv('satis-kayitlari.csv', rows);
    showToast('Satış kayıtları indirildi.');
  }

  /* ---------------- MAKİNA TAKİP TAB ---------------- */

  function warrantyInfo(m){
    if(!m.warrantyStart || m.warrantyMonths == null || m.warrantyMonths === '') return {bitis:null, cls:'', label:'—', color:'var(--text-dim)'};
    var start = new Date(m.warrantyStart+'T00:00:00');
    var end = new Date(start);
    end.setMonth(end.getMonth() + Number(m.warrantyMonths));
    var bitis = end.getFullYear() + '-' + String(end.getMonth()+1).padStart(2,'0') + '-' + String(end.getDate()).padStart(2,'0');
    var aktif = bitis >= todayStr();
    return aktif
      ? {bitis: bitis, cls:'ok', label:'Garanti Aktif', color:'var(--green)'}
      : {bitis: bitis, cls:'out', label:'Garanti Bitti', color:'var(--rust)'};
  }

  function machineServices(mid){
    return state.services.filter(function(s){ return s.machineId === mid; })
      .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  }

  function filteredMachines(){
    var q = state.search.trim().toLocaleLowerCase('tr');
    return state.machines.filter(function(m){
      if(!q) return true;
      return (m.customerName||'').toLocaleLowerCase('tr').indexOf(q) !== -1 ||
             (m.machineName||'').toLocaleLowerCase('tr').indexOf(q) !== -1;
    }).sort(function(a,b){ return (b.saleDate||'').localeCompare(a.saleDate||''); });
  }

  function renderMakina(){
    if(state.selectedMachineId) return renderMakinaDetail();

    if(state.machines.length === 0){
      return '<div class="empty"><h3>Henüz makina satışı yok</h3><p>Sıfır makina sattığınızda kaydını buradan ekleyin.</p>' +
        '<button class="btn primary" id="empty-add-machine">+ Makina Satışı Ekle</button></div>';
    }
    var list = filteredMachines();
    if(list.length === 0){
      return '<div class="empty"><h3>Sonuç yok</h3><p>Arama kriterine uyan makina kaydı bulunamadı.</p></div>';
    }

    var rows = list.map(function(m){
      var w = warrantyInfo(m);

  async function exportMachineExcel(machineId){
    var m = state.machines.find(function(x){ return x.id === machineId; });
    if(!m) return;
    var w = warrantyInfo(m);
    var services = machineServices(m.id);
    var INK = 'FF111111', ACCENT = 'FFC1584A', GREY = 'FFF5F5F3';
    var moneyFmt = '0';

    try{
      var wb = new ExcelJS.Workbook();
      wb.creator = 'DMC Makina';
      wb.created = new Date();

      var ws = wb.addWorksheet('Servis Raporu', { views:[{ showGridLines:false }] });
      ws.columns = [ { width:16 }, { width:40 }, { width:12 }, { width:16 } ];

      ws.mergeCells('A1:D1');
      ws.getCell('A1').value = m.machineName;
      ws.getCell('A1').font = { size:16, bold:true, color:{argb:INK} };
      ws.mergeCells('A2:D2');
      ws.getCell('A2').value = 'Makina Servis Raporu — ' + m.customerName;
      ws.getCell('A2').font = { size:12, bold:true, color:{argb:ACCENT} };
      ws.mergeCells('A3:D3');
      ws.getCell('A3').value = 'Rapor Tarihi: ' + fmtDate(todayStr());
      ws.getCell('A3').font = { size:9, italic:true, color:{argb:'FF888888'} };
      ws.addRow([]);

      var infoRows = [
        ['Satış Tarihi', fmtDate(m.saleDate)],
        ['Garanti Başlangıç', fmtDate(m.warrantyStart)],
        ['Garanti Süresi', m.warrantyMonths + ' ay'],
        ['Garanti Bitiş', (w.bitis?fmtDate(w.bitis):'-') + ' — ' + w.label]
      ];
      infoRows.forEach(function(r){
        var row = ws.addRow([r[0], r[1]]);
        row.getCell(1).font = { bold:true };
      });
      ws.addRow([]);

      var headerRow = ws.addRow(['Tarih','Yapılan İşlem','Süre','Tür']);
      headerRow.eachCell(function(c){
        c.font = { bold:true, color:{argb:'FFFFFFFF'} };
        c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:INK} };
      });

      services.forEach(function(s, i){
        var row = ws.addRow([fmtDate(s.date), s.desc, s.days!=null?(s.days+' gün'):'-', s.visitType]);
        if(i % 2 === 1){ row.eachCell(function(c){ c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:GREY} }; }); }
      });

      var buffer = await wb.xlsx.writeBuffer();
      var blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      saveAs(blob, m.machineName.replace(/[^a-zA-Z0-9ığüşöçİĞÜŞÖÇ ]/g,'') + ' - servis raporu.xlsx');
      showToast('Excel indirildi.');
    }catch(e){
      showToast('Excel oluşturulamadı, tekrar deneyin.');
    }
  }

  function filteredPriceList(){
    var q = state.search.trim().toLocaleLowerCase('tr');
    return state.priceList.filter(function(p){
      if(!q) return true;
      return (p.name||'').toLocaleLowerCase('tr').indexOf(q) !== -1 ||
             (p.model||'').toLocaleLowerCase('tr').indexOf(q) !== -1;
    }).sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','tr'); });
  }

  function fmtPrice(price, currency){
    var n = Number(price)||0;
    var sym = currency === 'USD' ? '$' : (currency === 'EUR' ? '€' : '₺');
    return sym + ' ' + n.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function fmtPriceHtml(price, currency){
    var n = Number(price)||0;
    var sym = currency === 'USD' ? '$' : (currency === 'EUR' ? '€' : '₺');
    return '<span style="color:var(--rust);font-weight:700;">'+sym+'</span> '+n.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

      }
      errEl.style.display = 'none';

      state.priceList.push({ id: uid(), name: name, model: model, size: size, condition: condition, price: price, currency: currency });
      var ok = await saveData();
      closeModal();
      renderToolbar();
      renderContent();
      if(ok) showToast('Makina eklendi.');
    };
  }

  async function deletePriceItem(id){
    var item = state.priceList.find(function(p){ return p.id === id; });
    if(!item) return;
    if(!window.confirm('"'+item.name+'" listeden silinsin mi? (Makinayı sattıysanız bu normal.)')) return;
    state.priceList = state.priceList.filter(function(p){ return p.id !== id; });
    var ok = await saveData();
    renderToolbar();
    renderContent();
    if(ok) showToast('Makina listeden kaldırıldı.');
  }

  function printPriceList(){
    var list = filteredPriceList().length ? state.priceList.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','tr'); }) : [];
    var logoImg = document.querySelector('.brand img.logo');
    var logoSrc = logoImg ? logoImg.src : '';

    var html =
      '<div class="p-headline">' +
        '<div class="p-brand">' +
          (logoSrc ? '<img src="'+logoSrc+'" alt="logo">' : '') +
          '<div><div class="p-brand-text">DMC Makina</div><div class="p-doctype">Makina Fiyat Listesi</div></div>' +
        '</div>' +
        '<div class="p-meta">' +
          '<div>Rapor Tarihi: ' + fmtDate(todayStr()) + '</div>' +
          '<div>Toplam Makina: ' + list.length + '</div>' +
        '</div>' +
      '</div>' +
      '<table><thead><tr><th>Makina</th><th>Model</th><th>Ölçü</th><th>Durum</th><th class="r">Fiyat</th></tr></thead><tbody>';

    if(list.length){
      list.forEach(function(p){
        html += '<tr><td>'+escapeHtml(p.name)+'</td><td>'+escapeHtml(p.model||'-')+'</td><td>'+escapeHtml(p.size||'-')+'</td><td>'+escapeHtml(p.condition)+'</td><td class="r"><strong>'+fmtPrice(p.price,p.currency)+'</strong></td></tr>';
      });
    } else {
      html += '<tr><td colspan="5" style="text-align:center;color:#999;">Kayıt yok</td></tr>';
    }
    html += '</tbody></table>' +
      '<div class="p-footer">DMC Makina · ' + fmtDate(todayStr()) + '</div>';

    document.getElementById('printArea').innerHTML = html;
    var oldTitle = document.title;
    document.title = 'Makina Fiyat Listesi';
    window.print();
    document.title = oldTitle;
  }

  /* ---------------- PDF / PRINT (STOK) ---------------- */

  function printStockList(){
    var list = state.parts.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','tr'); });
    var totalUnits = list.reduce(function(s,p){ return s + (Number(p.qty)||0); }, 0);
    var stockValue = list.reduce(function(s,p){ return s + (Number(p.qty)||0) * (Number(p.costPrice)||0); }, 0);
    var saleValue = list.reduce(function(s,p){ return s + (Number(p.qty)||0) * (Number(p.salePrice)||0); }, 0);

    var logoImg = document.querySelector('.brand img.logo');
    var logoSrc = logoImg ? logoImg.src : '';

    var html =
      '<div class="p-headline">' +
        '<div class="p-brand">' +
          (logoSrc ? '<img src="'+logoSrc+'" alt="logo">' : '') +
          '<div><div class="p-brand-text">DMC Makina</div><div class="p-doctype">Stok Listesi</div></div>' +
        '</div>' +
        '<div class="p-meta">' +
          '<div>Rapor Tarihi: ' + fmtDate(todayStr()) + '</div>' +
          '<div>Toplam Parça Çeşidi: ' + list.length + '</div>' +
        '</div>' +
      '</div>' +
      '<table><thead><tr>' +
        '<th>Malzeme Adı</th><th>Makine</th><th class="r">Stok</th><th class="r">Alış Fiyatı</th><th class="r">Satış Fiyatı</th><th>Durum</th>' +
      '</tr></thead><tbody>';

    if(list.length){
      list.forEach(function(p){
        var st = stockStatus(p.qty);
        html += '<tr><td>'+escapeHtml(p.name)+'</td><td>'+escapeHtml(p.machine||'-')+'</td>' +
          '<td class="r"><strong>'+Number(p.qty||0)+'</strong></td>' +
          '<td class="r">'+fmtMoney(p.costPrice)+'</td>' +
          '<td class="r">'+fmtMoney(p.salePrice)+'</td>' +
          '<td>'+st.label+'</td></tr>';
      });
    } else {
      html += '<tr><td colspan="6" style="text-align:center;color:#999;">Kayıt yok</td></tr>';
    }

    html += '</tbody></table>' +
      '<div class="p-summary">' +
        '<div><span>Toplam Stok Adedi</span><span>' + totalUnits + '</span></div>' +
        '<div><span>Stok Değeri (Alış)</span><span>' + fmtMoney(stockValue) + '</span></div>' +
        '<div class="final"><span>Stok Değeri (Satış)</span><span>' + fmtMoney(saleValue) + '</span></div>' +
      '</div>' +
      '<div class="p-footer">DMC Makina · ' + fmtDate(todayStr()) + '</div>';

    document.getElementById('printArea').innerHTML = html;
    var oldTitle = document.title;
    document.title = 'Stok Listesi';
    window.print();
    document.title = oldTitle;
  }

  /* ---------------- HAFTALIK YEDEK HATIRLATMASI ---------------- */

  function mondayOfWeek(d){
    var dt = new Date(d);
    var day = dt.getDay();
    var diff = day === 0 ? -6 : (1 - day);
    dt.setDate(dt.getDate() + diff);
    return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  }
  function checkWeeklyBackupReminder(){
    var now = new Date();
    if(now.getDay() !== 1) return;
    var thisMonday = mondayOfWeek(now);
    var lastShown = localStorage.getItem('yedekHatirlatmaHaftasi');
    if(lastShown === thisMonday) return;
    showBackupReminder(thisMonday);
  }
  function markBackupReminderSeen(weekKey){
    try{ localStorage.setItem('yedekHatirlatmaHaftasi', weekKey); }catch(e){}
  }
  function showBackupReminder(weekKey){
    var root = document.getElementById('modal-root');
    root.innerHTML =
      '<div class="overlay" id="ov"><div class="modal" style="text-align:center;">' +
        '<div style="font-size:38px;margin-bottom:6px;">📅</div>' +
        '<h3 style="margin-bottom:8px;">Haftalık Yedek Alma Zamanı!</h3>' +
        '<p style="font-size:13.5px;color:var(--text-muted);margin:0 0 16px;">Stok, satış, makina ve fiyat listesi verilerinin tek bir PDF yedeğini almanı öneririz.</p>' +
        '<div class="modal-actions">' +
          '<button class="btn ghost" id="bk-later">Daha Sonra</button>' +
          '<button class="btn primary" id="bk-now">📦 Şimdi Yedek Al</button>' +
        '</div>' +
      '</div></div>';
    document.getElementById('bk-later').onclick = function(){ markBackupReminderSeen(weekKey); closeModal(); };
    document.getElementById('bk-now').onclick = function(){ markBackupReminderSeen(weekKey); closeModal(); printFullBackup(); };
  }

  function printFullBackup(){
    var logoImg = document.querySelector('.brand img.logo');
    var logoSrc = logoImg ? logoImg.src : '';
    var parts = state.parts.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','tr'); });
    var sales = state.sales.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
    var machines = state.machines.slice().sort(function(a,b){ return (b.saleDate||'').localeCompare(a.saleDate||''); });
    var priceItems = state.priceList.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','tr'); });

    var html =
      '<div class="p-headline">' +
        '<div class="p-brand">' +
          (logoSrc ? '<img src="'+logoSrc+'" alt="logo">' : '') +
          '<div><div class="p-brand-text">DMC Makina</div><div class="p-doctype">Haftalık Tam Yedek</div></div>' +
        '</div>' +
        '<div class="p-meta"><div>Rapor Tarihi: ' + fmtDate(todayStr()) + '</div></div>' +
      '</div>';

    html += '<h2>Stok Listesi</h2><table><thead><tr><th>Malzeme Adı</th><th>Makine</th><th class="r">Stok</th><th class="r">Alış</th><th class="r">Satış</th></tr></thead><tbody>';
    if(parts.length){
      parts.forEach(function(p){
        html += '<tr><td>'+escapeHtml(p.name)+'</td><td>'+escapeHtml(p.machine||'-')+'</td><td class="r">'+Number(p.qty||0)+'</td><td class="r">'+fmtMoney(p.costPrice)+'</td><td class="r">'+fmtMoney(p.salePrice)+'</td></tr>';
      });
    } else { html += '<tr><td colspan="5" style="text-align:center;color:#999;">Kayıt yok</td></tr>'; }
    html += '</tbody></table>';

    html += '<h2>Satışlar</h2><table><thead><tr><th>Tarih</th><th>Parça</th><th>Müşteri</th><th class="r">Adet</th><th class="r">Tutar</th></tr></thead><tbody>';
    if(sales.length){
      sales.forEach(function(s){
        html += '<tr><td>'+fmtDate(s.date)+'</td><td>'+escapeHtml(s.partName)+'</td><td>'+escapeHtml(s.customer||'-')+'</td><td class="r">'+Number(s.qty||0)+'</td><td class="r">'+fmtMoney((Number(s.salePrice)||0)*(Number(s.qty)||0))+'</td></tr>';
      });
    } else { html += '<tr><td colspan="5" style="text-align:center;color:#999;">Kayıt yok</td></tr>'; }
    html += '</tbody></table>';

    html += '<h2>Makina Takip</h2><table><thead><tr><th>Makina</th><th>Firma</th><th>Satış Tarihi</th><th>Garanti Bitiş</th><th>Durum</th></tr></thead><tbody>';
    if(machines.length){
      machines.forEach(function(m){
        var w = warrantyInfo(m);
        html += '<tr><td>'+escapeHtml(m.machineName)+'</td><td>'+escapeHtml(m.customerName)+'</td><td>'+fmtDate(m.saleDate)+'</td><td>'+(w.bitis?fmtDate(w.bitis):'-')+'</td><td>'+w.label+'</td></tr>';
      });
    } else { html += '<tr><td colspan="5" style="text-align:center;color:#999;">Kayıt yok</td></tr>'; }
    html += '</tbody></table>';

    machines.forEach(function(m){
      var svc = machineServices(m.id);
      if(!svc.length) return;
      html += '<h2 style="font-size:13px;">'+escapeHtml(m.machineName)+' — Servis Geçmişi</h2><table><thead><tr><th>Tarih</th><th>Yapılan İşlem</th><th class="r">Süre</th><th>Tür</th></tr></thead><tbody>';
      svc.forEach(function(s){
        html += '<tr><td>'+fmtDate(s.date)+'</td><td>'+escapeHtml(s.desc)+'</td><td class="r">'+(s.days!=null?s.days+' gün':'-')+'</td><td>'+escapeHtml(s.visitType)+'</td></tr>';
      });
      html += '</tbody></table>';
    });

    html += '<h2>Fiyat Listesi</h2><table><thead><tr><th>Makina</th><th>Model</th><th>Ölçü</th><th>Durum</th><th class="r">Fiyat</th></tr></thead><tbody>';
    if(priceItems.length){
      priceItems.forEach(function(p){
        html += '<tr><td>'+escapeHtml(p.name)+'</td><td>'+escapeHtml(p.model||'-')+'</td><td>'+escapeHtml(p.size||'-')+'</td><td>'+escapeHtml(p.condition)+'</td><td class="r">'+fmtPrice(p.price,p.currency)+'</td></tr>';
      });
    } else { html += '<tr><td colspan="5" style="text-align:center;color:#999;">Kayıt yok</td></tr>'; }
    html += '</tbody></table>';

    html += '<div class="p-footer">DMC Makina · Haftalık Yedek · ' + fmtDate(todayStr()) + '</div>';

    document.getElementById('printArea').innerHTML = html;
    var oldTitle = document.title;
    document.title = 'Haftalik Yedek ' + todayStr();
    window.print();
    document.title = oldTitle;
  }

  function updateClock(){
    var el = document.getElementById('clockVal');
    if(!el) return;
    var now = new Date();
    var dateStr = now.toLocaleDateString('tr-TR', {day:'2-digit', month:'2-digit', year:'numeric'});
    var timeStr = now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    el.textContent = dateStr + ' · ' + timeStr;
  }
  updateClock();
  setInterval(updateClock, 1000);
  var manualBackupBtn = document.getElementById('btn-manual-backup');
  if(manualBackupBtn) manualBackupBtn.onclick = function(){ printFullBackup(); };

  (async function init(){
    await loadData();
    renderToolbar();
    renderContent();
    checkWeeklyBackupReminder();
  })();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

})();
</script>
</body>
